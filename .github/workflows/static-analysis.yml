name: Static Code Analysis
on: 
  push:
    branches:
      - main
      - dev
jobs:
  check-syntax:
    #runs-on: [freebsd, linux, x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
          architecture: x64
      - run: pip install -r <(grep ansible tests/requirements.txt) ansible-lint netaddr
      - run: ansible-galaxy install -r requirements.yml
      - run: ansible-lint -x 'yaml[line-length],role-name,run-once' -v --force-color ./sf_role/*/ ./createPackage.yml       
      - run: ansible-playbook -i ./createPackage.yml--syntax-check --list-tasks -vv
  check-nbsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: if [[ -n $(grep --exclude-dir=.git -P "\xa0" -r .) ]]; then echo 'NBSP characters found'; exit 1; fi
